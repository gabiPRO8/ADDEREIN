<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Adderein · Foundations covered by cybersecurity</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@10..48,400..800&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
  :root{
    --surface:#FFFFFF;--border:#E5E7E2;
    --text:#0E1410;--text-muted:#5B6360;--text-faint:#9CA39E;
    --green:#1FA34F;--green-bright:#29C25F;--green-dark:#11703A;--green-deep:#0B4A26;
    --green-soft:#E6F4EA;--green-line:rgba(31,163,79,.25);
    --f-display:"Bricolage Grotesque","Inter Tight",system-ui,sans-serif;
    --f-body:"Inter Tight",system-ui,sans-serif;
    --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:transparent;}
  body{
    font-family:var(--f-body);color:var(--text);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  svg{width:100%;height:100%;}

  .hbar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);opacity:0;
        transition:transform .9s var(--ease),opacity .5s ease;transition-delay:0s;}
  .vbar{transform-box:fill-box;transform-origin:bottom center;transform:scaleY(0);opacity:0;
        transition:transform .7s var(--ease),opacity .4s ease;transition-delay:0s;}
  .xnode{transform-box:fill-box;transform-origin:center;transform:scale(0);opacity:0;
        transition:transform .4s var(--ease),opacity .3s ease;transition-delay:0s;}
  .fade{opacity:0;transition:opacity .6s ease;transition-delay:0s;}
  /* the cybersecurity cover wraps everything — appears last */
  #cover{transform-box:fill-box;transform-origin:center;transform:scale(1.05);opacity:0;
         transition:transform 1s var(--ease),opacity .8s ease;transition-delay:0s;}
  #coverHalo{transform-box:fill-box;transform-origin:center;animation:cpulse 4s ease-in-out infinite;}
  @keyframes cpulse{0%,100%{opacity:.5}50%{opacity:1}}

  .built .hbar{transform:scaleX(1);opacity:1;transition-delay:var(--td);}
  .built .vbar{transform:scaleY(1);opacity:1;transition-delay:var(--td);}
  .built .xnode{transform:scale(1);opacity:1;transition-delay:var(--td);}
  .built .fade{opacity:1;transition-delay:var(--td);}
  .built #cover{transform:scale(1);opacity:1;transition-delay:var(--td);}

  .hname{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;fill:var(--text);}
  .hdesc{font-family:var(--f-body);font-size:14px;fill:var(--text-muted);}
  .vlab{font-family:var(--f-display);font-weight:600;font-size:14.5px;letter-spacing:-.01em;fill:var(--text);text-anchor:middle;}
  .cov-t{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:15px;letter-spacing:.22em;
         text-transform:uppercase;fill:var(--green-dark);}
  .cov-s{font-family:var(--f-body);font-weight:500;font-size:14px;fill:var(--text-muted);}

  @media (prefers-reduced-motion: reduce){
    .hbar,.vbar,.xnode,.fade,#cover{transition:none;}
    #coverHalo{animation:none;}
  }
  /* printed fully drawn (complete state — all beams, blocks and the cover) */
  @media print{
    #coverHalo{animation:none !important;}
    .hbar{transform:scaleX(1) !important;opacity:1 !important;}
    .vbar{transform:scaleY(1) !important;opacity:1 !important;}
    .xnode{transform:scale(1) !important;opacity:1 !important;}
    .fade{opacity:1 !important;}
    #cover{transform:scale(1) !important;opacity:1 !important;}
  }
</style>
</head>
<body>
  <svg id="viz" viewBox="0 0 1080 600" role="img" aria-label="Two transversal foundations — the data centre and the transport backbone — carry four blocks of services (voice, information, security and control). Cybersecurity is not another foundation: it is a cover wrapping every layer, by design.">
    <defs>
      <linearGradient id="gdc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0B4A26"/><stop offset="1" stop-color="#11703A"/></linearGradient>
      <linearGradient id="gco" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#11703A"/><stop offset="1" stop-color="#1FA34F"/></linearGradient>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0E1410" flood-opacity="0.10"/>
      </filter>
    </defs>

    <g id="scene">
      <g id="beams"></g>
      <g id="verts"></g>
      <g id="nodes"></g>
      <g id="blabels"></g>
      <g id="vlabels"></g>

      <!-- cybersecurity cover: wraps every layer, drawn last and on top -->
      <g id="cover">
        <rect id="coverHalo" x="48" y="58" width="984" height="492" rx="28" fill="none" stroke="var(--green-bright)" stroke-width="6" opacity=".5"/>
        <rect x="54" y="64" width="972" height="480" rx="24" fill="var(--green-soft)" fill-opacity=".22" stroke="var(--green)" stroke-width="2.5"/>
        <rect x="66" y="76" width="948" height="456" rx="18" fill="none" stroke="var(--green-line)" stroke-width="1.5" stroke-dasharray="3 9"/>
        <g id="coverHead"></g>
      </g>
    </g>
  </svg>

<script>
(function(){
  var NS="http://www.w3.org/2000/svg";
  var HX=150, HLEN=520, HH=46, LX=HX+HLEN+30;

  function el(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);return e;}
  function icon(name,x,y,sc,stroke){
    sc=sc||1.2; stroke=stroke||"#fff";
    var g=el("g",{transform:"translate("+x+","+y+") scale("+sc+")",fill:"none",stroke:stroke,"stroke-width":1.6,"stroke-linecap":"round","stroke-linejoin":"round"});
    var P=[];
    if(name==="server"){P=["M-9 -9h18v6h-18z","M-9 1h18v6h-18z"];g.appendChild(el("circle",{cx:-6,cy:-6,r:.9,fill:stroke,stroke:"none"}));g.appendChild(el("circle",{cx:-6,cy:4,r:.9,fill:stroke,stroke:"none"}));}
    else if(name==="wifi"){P=["M-9 -2a9 9 0 0 1 18 0","M-5 2a5 5 0 0 1 10 0"];g.appendChild(el("circle",{cx:0,cy:6,r:1.5,fill:stroke,stroke:"none"}));}
    else if(name==="shield"){P=["M0 -11l9 3.4v5.6c0 5.6-3.8 9.1-9 10.8-5.2-1.7-9-5.2-9-10.8v-5.6z","M-3.8 0l2.4 2.4 4.9-4.9"];}
    P.forEach(function(d){g.appendChild(el("path",{d:d}));});
    return g;
  }

  var beams=[
    {cy:300, grad:"gdc", icon:"server", en:{n:"Data centre",        d:"Where all the information is stored"}, es:{n:"Centro de datos",       d:"Donde se almacena la información"}},
    {cy:408, grad:"gco", icon:"wifi",   en:{n:"Transport backbone", d:"The network the data travels on"},     es:{n:"Columna de transporte", d:"La red por la que viajan los datos"}}
  ];
  var VW=36, VTOP=250, VBOT=458, VHT=VBOT-VTOP;
  var verts=[
    {x:235, en:"Voice",       es:"Voz"},
    {x:360, en:"Information", es:"Información"},
    {x:485, en:"Security",    es:"Seguridad"},
    {x:610, en:"Control",     es:"Control"}
  ];

  var gB=document.getElementById("beams"), gV=document.getElementById("verts"),
      gN=document.getElementById("nodes"), gBL=document.getElementById("blabels"),
      gVL=document.getElementById("vlabels"), gCH=document.getElementById("coverHead");

  // foundation beams + their right-side descriptions
  beams.forEach(function(b,i){
    var td=(i*1.1).toFixed(2)+"s";
    var bar=el("g",{}); bar.setAttribute("class","hbar"); bar.style.setProperty("--td",td);
    bar.appendChild(el("rect",{x:HX,y:b.cy-HH/2,width:HLEN,height:HH,rx:9,fill:"url(#"+b.grad+")",filter:"url(#soft)"}));
    bar.appendChild(icon(b.icon,HX+34,b.cy,1.3));
    gB.appendChild(bar);

    var lab=el("g",{}); lab.setAttribute("class","fade"); lab.style.setProperty("--td",td);
    var nm=el("text",{x:LX,y:b.cy-4}); nm.setAttribute("class","hname"); lab.appendChild(nm); b.nmEl=nm;
    var ds=el("text",{x:LX,y:b.cy+18}); ds.setAttribute("class","hdesc"); lab.appendChild(ds); b.dsEl=ds;
    gBL.appendChild(lab);
  });

  // vertical service blocks resting on the foundations
  verts.forEach(function(v,i){
    var td=(2.3+i*0.5).toFixed(2)+"s";
    var bar=el("g",{}); bar.setAttribute("class","vbar"); bar.style.setProperty("--td",td);
    bar.appendChild(el("rect",{x:v.x-VW/2,y:VTOP,width:VW,height:VHT,rx:8,fill:"var(--green-soft)",stroke:"var(--green)","stroke-width":1.8,filter:"url(#soft)"}));
    gV.appendChild(bar);

    var lab=el("g",{}); lab.setAttribute("class","fade"); lab.style.setProperty("--td",td);
    var t=el("text",{x:v.x,y:VTOP-14}); t.setAttribute("class","vlab"); lab.appendChild(t); v.tEl=t;
    gVL.appendChild(lab);
  });

  // intersection nodes
  var ni=0;
  verts.forEach(function(v){
    beams.forEach(function(b){
      var d=el("circle",{cx:v.x,cy:b.cy,r:4.5,fill:"var(--green-deep)",stroke:"#fff","stroke-width":1.4});
      d.setAttribute("class","xnode"); d.style.setProperty("--td",(4.2+ni*0.05).toFixed(2)+"s"); ni++;
      gN.appendChild(d);
    });
  });

  // cover header (shield + label), centred near the top of the cover
  (function(){
    var cxh=540, yh=112;
    gCH.appendChild(icon("shield", cxh-150, yh-4, 1.5, "var(--green-dark)"));
    var t=el("text",{x:cxh-126, y:yh-2,"text-anchor":"start"}); t.setAttribute("class","cov-t"); gCH.appendChild(t); gCH.tEl=t;
    var s=el("text",{x:cxh-126, y:yh+20,"text-anchor":"start"}); s.setAttribute("class","cov-s"); gCH.appendChild(s); gCH.sEl=s;
  })();

  var COVER={ en:{t:"Cybersecurity", s:"A cover over every layer — by design"},
              es:{t:"Ciberseguridad", s:"Una cubierta sobre cada capa — por diseño"} };

  function setLang(lang){
    if(lang!=="en"&&lang!=="es") lang="en";
    document.documentElement.setAttribute("lang",lang);
    beams.forEach(function(b){ b.nmEl.textContent=b[lang].n; b.dsEl.textContent=b[lang].d; });
    verts.forEach(function(v){ v.tEl.textContent=v[lang]; });
    gCH.tEl.textContent=COVER[lang].t; gCH.sEl.textContent=COVER[lang].s;
  }
  var LANG_KEY="adderein-lang",lang="en";
  try{var s=localStorage.getItem(LANG_KEY);if(s==="en"||s==="es")lang=s;}catch(e){}
  setLang(lang);
  window.addEventListener("storage",function(e){if(e.key===LANG_KEY)setLang(e.newValue);});

  // cover appears last (after nodes) — the wrap moment
  document.getElementById("cover").style.setProperty("--td","5.0s");

  var scene=document.getElementById("viz");
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){ scene.classList.add("built"); }
  else{
    function cycle(){
      scene.classList.add("built");
      setTimeout(function(){
        scene.classList.remove("built");
        setTimeout(cycle, 1300);
      }, 12500);
    }
    setTimeout(cycle, 400);
  }
})();
</script>
</body>
</html>
